plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jabe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

def viaFabricPlusOriginal = file("vendor/runtime/ViaFabricPlus-4.5.5.jar")
def viaBedrockProject = file("vendor/ViaBedrock")
def viaBedrockJar = file("vendor/ViaBedrock/build/libs/ViaBedrock-0.0.29-SNAPSHOT.jar")
def bundledRuntimeJar = layout.buildDirectory.file("bundled/viafabricplus-jabe-4.5.5.jar")

tasks.register("buildBundledViaBedrock", Exec) {
	inputs.dir(file("vendor/ViaBedrock/src"))
	inputs.files(file("vendor/ViaBedrock/build.gradle"), file("vendor/ViaBedrock/gradle.properties"))
	outputs.file(viaBedrockJar)
	workingDir viaBedrockProject
	if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
		commandLine "cmd", "/c", "gradlew.bat", "jar", "--no-daemon", "--console=plain"
	} else {
		commandLine "./gradlew", "jar", "--no-daemon", "--console=plain"
	}
}

tasks.register("prepareBundledBedrockRuntime", Zip) {
	dependsOn "buildBundledViaBedrock"
	inputs.file(viaFabricPlusOriginal)
	inputs.file(viaBedrockJar)
	archiveFileName = "viafabricplus-jabe-4.5.5.jar"
	destinationDirectory = layout.buildDirectory.dir("bundled")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from(zipTree(viaFabricPlusOriginal)) {
		exclude "META-INF/jars/ViaBedrock-0.0.28-SNAPSHOT.jar"
	}
	from(viaBedrockJar) {
		into "META-INF/jars"
		rename { "ViaBedrock-0.0.28-SNAPSHOT.jar" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Local development automation only. This is never bundled into Jabe's jar.
	def mineAgentJar = file("../MineAgent/build/libs/mineagent-0.2.0.jar")
	if (mineAgentJar.exists()) {
		runtimeOnly files(mineAgentJar)
	}

	// Embedded Bedrock transport. ViaFabricPlus supplies Fabric/Netty integration,
	// with its ViaBedrock library replaced by the protocol 2168 build above.
	def bundledRuntime = files(bundledRuntimeJar).builtBy("prepareBundledBedrockRuntime")
	runtimeOnly bundledRuntime
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	dependsOn "prepareBundledBedrockRuntime"
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
	from("THIRD_PARTY_NOTICES.md")
	from("vendor/ViaBedrock/LICENSE") {
		rename { "LICENSE_ViaBedrock" }
	}
	from(bundledRuntimeJar) {
		into "META-INF/jars"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
